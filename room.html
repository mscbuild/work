<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home — Living Room Dashboard</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.min.css" rel="stylesheet">
<style>
  :root{
    --blue:#2e7cf5;
    --blue-deep:#1f6ae0;
    --glass:rgba(255,255,255,.14);
    --glass-soft:rgba(255,255,255,.10);
    --glass-brd:rgba(255,255,255,.22);
    --txt:#ffffff;
    --txt-dim:rgba(255,255,255,.72);
    --radius-lg:28px;
    --radius-md:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--txt);
    overflow-x:hidden;
    background:#c8b49c;
  }
  .bg{position:fixed;inset:0;z-index:-1}
  .bg img{width:100%;height:100%;object-fit:cover}
  .bg::after{content:'';position:absolute;inset:0;background:rgba(40,35,30,.08)}

  .scene{
    max-width:1440px;margin:0 auto;
    padding:28px 40px 56px;
    min-height:100vh;
    display:flex;flex-direction:column;gap:26px;
  }

  /* ============ GLASS ============ */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(26px) saturate(140%);
    backdrop-filter:blur(26px) saturate(140%);
    border:1px solid var(--glass-brd);
    box-shadow:0 18px 40px rgba(30,25,20,.18);
  }

  /* ============ TOP NAV ============ */
  .topnav{
    align-self:center;
    display:flex;align-items:center;gap:6px;
    padding:10px 20px;border-radius:999px;
    background:rgba(105,105,105,.38);
    max-width:100%;
    animation:rise .7s .05s ease both;
  }
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:11px 24px;border-radius:999px;border:none;cursor:pointer;
    background:transparent;color:var(--txt);
    font:600 15px/1 'Inter',sans-serif;white-space:nowrap;
    transition:background .3s,box-shadow .3s;
  }
  .tab:hover{background:rgba(255,255,255,.14)}
  .tab.active{background:rgba(255,255,255,.30);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.10)}
  .nav-divider{width:1px;height:26px;background:rgba(255,255,255,.4);margin:0 10px;flex:none}
  .add-btn{
    display:flex;align-items:center;gap:9px;border:none;background:transparent;
    color:var(--txt);font:600 15px/1 'Inter',sans-serif;cursor:pointer;flex:none;
    transition:transform .2s;
  }
  .add-btn:hover{transform:scale(1.05)}
  .plus-badge{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 4px 10px rgba(46,124,245,.45)}
  .plus-badge svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4}

  /* ============ SIDEBAR ============ */
  .sidebar{
    position:fixed;left:26px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:16px 10px;border-radius:999px;z-index:20;
    background:rgba(120,115,110,.35);
    animation:fadeL .8s .2s ease both;
  }
  .side-icon{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    display:grid;place-items:center;background:transparent;color:var(--txt);
    transition:background .3s,transform .2s;
  }
  .side-icon:hover{background:rgba(255,255,255,.16);transform:scale(1.06)}
  .side-icon.lit{background:rgba(255,255,255,.28)}
  .side-icon.blue{background:var(--blue);box-shadow:0 6px 14px rgba(46,124,245,.45)}
  .side-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ============ DASH LAYOUT ============ */
  .dash{display:flex;gap:28px;align-items:stretch;justify-content:center;flex:1}

  .main-panel{
    flex:1 1 720px;max-width:920px;
    border-radius:var(--radius-lg);
    padding:26px 28px;
    display:flex;flex-direction:column;
    max-height:690px;
    animation:rise .8s .15s ease both;
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
  .panel-head h1{font:600 32px/1.1 'Inter',sans-serif;letter-spacing:.3px}
  .chip{
    display:flex;align-items:center;gap:8px;
    padding:10px 18px;border-radius:999px;border:none;cursor:pointer;
    background:rgba(255,255,255,.16);color:var(--txt);
    font:600 13px/1 'Inter',sans-serif;
    transition:background .3s;
  }
  .chip:hover{background:rgba(255,255,255,.28)}
  .chip svg{width:11px;height:11px;stroke:#fff;stroke-width:2.4}

  .panel-body{
    flex:1;display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:16px;
    overflow-y:auto;scrollbar-width:none;padding-right:2px;
  }
  .panel-body::-webkit-scrollbar{display:none}

  .col-stats{display:flex;flex-direction:column;gap:16px;min-width:0}
  .col-devices{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;min-width:0}

  /* ============ CARDS ============ */
  .card{
    border-radius:var(--radius-md);
    background:var(--glass-soft);
    border:1px solid rgba(255,255,255,.10);
    padding:18px;position:relative;
    transition:transform .25s,background .25s;
  }
  .card:hover{transform:translateY(-2px)}

  .stat{display:flex;align-items:center;gap:14px}
  .icon-circle{
    width:40px;height:40px;border-radius:50%;flex:none;
    background:rgba(255,255,255,.22);display:grid;place-items:center;
  }
  .icon-circle svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .stat strong{font:600 22px/1.15 'Inter',sans-serif;display:block}
  .stat span{font:500 12px/1.3 'Inter',sans-serif;color:var(--txt-dim);display:block}

  .card.blue{
    background:linear-gradient(120deg,var(--blue),#4b93ff);
    border-color:rgba(255,255,255,.35);
    display:flex;align-items:center;gap:14px;overflow:hidden;
    box-shadow:0 12px 26px rgba(46,124,245,.35);
  }
  .card.blue .icon-circle{background:rgba(255,255,255,.28)}
  .card.blue .icon-circle svg{fill:#fff;stroke:none}
  .card.blue span{color:rgba(255,255,255,.8)}
  .spark{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:120px;height:52px;opacity:.9;pointer-events:none}

  /* camera */
  .camera{padding:0;overflow:hidden;flex:1;min-height:230px}
  .camera>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cam-select{
    display:flex;align-items:center;gap:6px;
    background:rgba(10,10,12,.62);border-radius:9px;padding:6px 10px;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .cam-select select{
    appearance:none;-webkit-appearance:none;background:transparent;border:none;outline:none;
    color:#fff;font:600 12px/1 'Inter',sans-serif;cursor:pointer;
  }
  .cam-select select option{color:#111}
  .cam-select svg{width:10px;height:10px;stroke:#fff;stroke-width:2.2;pointer-events:none}
  .live{
    display:flex;align-items:center;gap:6px;
    background:rgba(10,10,12,.62);border-radius:9px;padding:7px 11px;
    font:600 12px/1 'Inter',sans-serif;
  }
  .live i{width:7px;height:7px;border-radius:50%;background:#ff4d4d;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,.55)}55%{box-shadow:0 0 0 6px rgba(255,77,77,0)}}

  /* devices */
  .device{display:flex;flex-direction:column;gap:12px;cursor:pointer}
  .device.led{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.30)}
  .device-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .device-head strong{font:600 16px/1.2 'Inter',sans-serif;display:block}
  .device-head span{font:500 12px/1.4 'Inter',sans-serif;color:var(--txt-dim);display:block}
  .device-img{border-radius:14px;overflow:hidden;background:rgba(255,255,255,.10)}
  .device-img img{width:100%;height:150px;object-fit:cover;display:block;transition:transform .4s}
  .device:hover .device-img img{transform:scale(1.05)}

  /* switch */
  .switch{position:relative;width:44px;height:24px;flex:none;display:inline-block}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
  .switch i{
    position:absolute;inset:0;border-radius:999px;
    background:rgba(255,255,255,.38);transition:background .3s;
  }
  .switch i::after{
    content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:left .3s;
  }
  .switch input:checked + i{background:var(--blue)}
  .switch input:checked + i::after{left:23px}

  /* ============ LED PANEL ============ */
  .led-panel{
    width:350px;flex:none;border-radius:var(--radius-lg);
    padding:24px;display:flex;flex-direction:column;gap:18px;
    animation:rise .8s .25s ease both;
  }
  .led-panel.hidden{display:none}
  .led-head{display:flex;align-items:center;justify-content:space-between}
  .led-head h2{font:600 22px/1 'Inter',sans-serif}
  .close-btn{
    width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.16);color:#fff;font-size:15px;line-height:1;
    display:grid;place-items:center;transition:background .3s,transform .2s;
  }
  .close-btn:hover{background:rgba(255,255,255,.3);transform:rotate(90deg)}

  .segmented{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.18)}
  .seg{
    flex:1;padding:9px 0;border-radius:999px;border:none;cursor:pointer;
    background:transparent;color:rgba(255,255,255,.85);
    font:600 12px/1 'Inter',sans-serif;transition:background .3s,color .3s;
  }
  .seg.active{background:rgba(255,255,255,.30);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}

  .wheel{
    width:min(258px,64vw);aspect-ratio:1;border-radius:50%;margin:4px auto;position:relative;
    background:
      radial-gradient(circle at 50% 50%, #fff 0%, rgba(255,255,255,.55) 22%, rgba(255,255,255,0) 72%),
      conic-gradient(from 0deg,#ff3b4d,#ffd60a 55deg,#54d62c 100deg,#00d0c0 175deg,#3b82f6 225deg,#a03bff 280deg,#ff3b4d 360deg);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.15),0 10px 26px rgba(0,0,0,.18);
    cursor:crosshair;flex:none;
  }
  .wheel-handle{
    position:absolute;width:16px;height:16px;border-radius:50%;
    border:2.5px solid #fff;background:transparent;
    left:26%;top:63%;transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(0,0,0,.35);pointer-events:none;
  }

  .bright-head{display:flex;align-items:flex-end;justify-content:space-between}
  .bright-head span{font:500 14px/1 'Inter',sans-serif;color:var(--txt-dim);padding-bottom:4px}
  .bright-head strong{font:600 30px/1 'Inter',sans-serif}
  .bright-row{display:flex;align-items:center;gap:10px}
  .bright-row svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
  .bright-row svg.big{width:19px;height:19px}
  .bright-row svg.dim{opacity:.55}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:999px;outline:none;
    background:linear-gradient(90deg,var(--blue) 56%,rgba(255,255,255,.35) 56%);
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:21px;height:21px;border-radius:50%;
    background:#fff;border:3.5px solid var(--blue);box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid var(--blue);box-shadow:0 3px 8px rgba(0,0,0,.3);
  }

  .schedule-row{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.12);border-radius:16px;padding:15px 16px;
    font:600 14px/1 'Inter',sans-serif;
  }
  .times{display:flex;gap:12px}
  .time-box{flex:1;background:rgba(255,255,255,.12);border-radius:15px;padding:11px 14px}
  .time-box>span{font:500 11px/1.4 'Inter',sans-serif;color:var(--txt-dim);display:block}
  .time-val{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .time-val select{
    appearance:none;-webkit-appearance:none;background:transparent;border:none;outline:none;
    color:#fff;font:600 14px/1.3 'Inter',sans-serif;cursor:pointer;width:100%;
  }
  .time-val select option{color:#111}
  .time-val svg{width:10px;height:10px;stroke:#fff;stroke-width:2.2;pointer-events:none;flex:none}

  /* ============ PAGINATION ============ */
  .pagination{align-self:center;display:flex;align-items:center;gap:10px;margin-top:4px}
  .pagination .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.65)}
  .pagination .bar{width:140px;height:8px;border-radius:999px;background:rgba(255,255,255,.55)}

  /* ============ ANIM ============ */
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeL{from{opacity:0;transform:translate(-16px,-50%)}to{opacity:1;transform:translate(0,-50%)}}

  /* ============ RESPONSIVE ============ */
  @media (max-width:1240px){
    .dash{flex-wrap:wrap}
    .main-panel{max-width:100%;flex:1 1 100%}
    .led-panel{width:min(430px,100%);margin:0 auto}
  }
  @media (max-width:940px){
    .scene{padding:20px 18px 120px}
    .sidebar{left:50%;top:auto;bottom:18px;transform:translateX(-50%);flex-direction:row;padding:10px 16px;animation:none}
    .panel-body{grid-template-columns:1fr;overflow:visible}
    .main-panel{max-height:none}
    .camera{min-height:250px}
    .panel-head h1{font-size:26px}
  }
  @media (max-width:560px){
    .topnav{padding:8px 12px;gap:4px}
    .tab{padding:10px 15px;font-size:13px}
    .add-btn span{display:none}
    .nav-divider{margin:0 4px}
    .col-devices{grid-template-columns:1fr 1fr;gap:12px}
    .device-img img{height:110px}
    .card{padding:14px}
    .stat strong{font-size:19px}
    .led-panel{padding:18px}
    .panel-head h1{font-size:23px}
  }
  @media (max-width:400px){
    .col-devices{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="bg"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/17c57de43-bff1-4710-94e4-d9b50f08667f.png" alt="Living room background"></div>

<div class="scene">

  <!-- ======= TOP NAV ======= -->
  <nav class="topnav glass">
    <div class="tabs" id="roomTabs">
      <button class="tab active">Living Room</button>
      <button class="tab">Bedroom</button>
      <button class="tab">Bathroom</button>
      <button class="tab">Kitchen</button>
      <button class="tab">Kids Room</button>
    </div>
    <span class="nav-divider"></span>
    <button class="add-btn">
      <span class="plus-badge"><svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10"/></svg></span>
      <span>Add</span>
    </button>
  </nav>

  <!-- ======= SIDEBAR ======= -->
  <aside class="sidebar glass" id="sideBar">
    <button class="side-icon lit" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg></button>
    <button class="side-icon" title="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
    <button class="side-icon" title="Stats"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/></svg></button>
    <button class="side-icon blue" title="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="side-icon" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.15-1.45l2-1.55-2-3.45-2.35.95a7 7 0 0 0-2.5-1.45L13.6 2.6h-3.2l-.4 2.5a7 7 0 0 0-2.5 1.45l-2.35-.95-2 3.45 2 1.55A7 7 0 0 0 5 12c0 .49.05.97.15 1.45l-2 1.55 2 3.45 2.35-.95a7 7 0 0 0 2.5 1.45l.4 2.5h3.2l.4-2.5a7 7 0 0 0 2.5-1.45l2.35.95 2-3.45-2-1.55c.1-.48.15-.96.15-1.45Z"/></svg></button>
    <button class="side-icon" title="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 19.4a7.6 7.6 0 0 1 14.4 0"/></svg></button>
  </aside>

  <main class="dash">

    <!-- ======= MAIN PANEL ======= -->
    <section class="main-panel glass">
      <div class="panel-head">
        <h1>Living Room</h1>
        <button class="chip"><svg viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="#fff" fill="none" stroke-linecap="round"/></svg>Add Device</button>
      </div>

      <div class="panel-body">
        <!-- left stats column -->
        <div class="col-stats">
          <article class="card blue stat">
            <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11L9.5 22 18 10.5h-6.5L13 2Z"/></svg></div>
            <div><strong>86 kWh</strong><span>Current Consumption</span></div>
            <svg class="spark" viewBox="0 0 120 52" fill="none">
              <path d="M2 30 C 18 30 24 26 34 26 S 50 34 60 32 70 18 80 20 92 34 102 28 112 10 118 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <circle cx="118" cy="8" r="3" fill="#fff"/>
            </svg>
          </article>

          <article class="card stat">
            <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.3a4.5 4.5 0 1 1-4 0V4Z"/><path d="M12 9v6"/></svg></div>
            <div><strong>52° F</strong><span>Temperature</span></div>
          </article>

          <article class="card stat">
            <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M12 3.5s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11Z"/></svg></div>
            <div><strong>50,6%</strong><span>Humidity</span></div>
          </article>

          <article class="card camera">
            <img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/1dad55c44-6b72-4f1a-9043-8656f08d4d37.png" alt="Camera 02 live view">
            <div class="cam-top">
              <label class="cam-select">
                <select id="camSelect" aria-label="Camera selector">
                  <option>Camera 01</option>
                  <option selected>Camera 02</option>
                  <option>Camera 03</option>
                </select>
                <svg viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
              </label>
              <span class="live"><i></i>Live</span>
            </div>
          </article>
        </div>

        <!-- devices grid -->
        <div class="col-devices">
          <article class="card device led" id="ledCard" title="Open Smart LED controls">
            <div class="device-head">
              <div><strong>Smart LED</strong><span>27 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox" checked><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/14ea588b7-810e-41d7-9938-d220be590def.png" alt="Smart LED lamp"></div>
          </article>

          <article class="card device">
            <div class="device-head">
              <div><strong>Robot Vacuum</strong><span>15 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox"><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/1ad502ca6-f5e4-49c3-92a8-f2f4cb87fe00.png" alt="Robot vacuum"></div>
          </article>

          <article class="card device">
            <div class="device-head">
              <div><strong>Wifi Router</strong><span>21 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox" checked><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/17da3fce2-a6e8-4e25-b678-47ba8d24a574.png" alt="Wifi router"></div>
          </article>

          <article class="card device">
            <div class="device-head">
              <div><strong>Smart TV</strong><span>12 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox"><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/1ae653d1a-5e36-4f20-a477-f27f19289457.png" alt="Smart TV"></div>
          </article>

          <article class="card device">
            <div class="device-head">
              <div><strong>Speaker</strong><span>15 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox"><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/167448225-51b6-49aa-b7e4-31573df42f8b.png" alt="Speaker"></div>
          </article>

          <article class="card device">
            <div class="device-head">
              <div><strong>Humidifier</strong><span>19 Kwh Usage</span></div>
              <label class="switch"><input type="checkbox" checked><i></i></label>
            </div>
            <div class="device-img"><img src="https://image.qwenlm.ai/public_source/1447820a-c5e0-43a9-9e8e-0cce51130328/169cebbc5-74e3-4b75-bd98-a40bbd9fff96.png" alt="Humidifier"></div>
          </article>
        </div>
      </div>
    </section>

    <!-- ======= SMART LED PANEL ======= -->
    <aside class="led-panel glass" id="ledPanel">
      <div class="led-head">
        <h2>Smart LED</h2>
        <button class="close-btn" id="closeLed" aria-label="Close panel">✕</button>
      </div>

      <div class="segmented" id="segCtl">
        <button class="seg active">Color</button>
        <button class="seg">White</button>
        <button class="seg">Scene</button>
      </div>

      <div class="wheel" id="colorWheel"><span class="wheel-handle" id="wheelHandle"></span></div>

      <div class="bright-head"><span>Brightness</span><strong id="brightVal">56%</strong></div>
      <div class="bright-row">
        <svg class="dim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19"/></svg>
        <input type="range" id="brightRange" min="0" max="100" value="56" aria-label="Brightness">
        <svg class="big" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M19.4 4.6l-1.9 1.9M6.5 17.5l-1.9 1.9"/></svg>
      </div>

      <div class="schedule-row">
        <span>Set Schedule</span>
        <label class="switch"><input type="checkbox" id="schedToggle"><i></i></label>
      </div>

      <div class="times">
        <div class="time-box">
          <span>On from</span>
          <div class="time-val">
            <select aria-label="On from">
              <option>02:00 PM</option><option>03:00 PM</option><option selected>04:00 PM</option><option>05:00 PM</option><option>06:00 PM</option>
            </select>
            <svg viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </div>
        </div>
        <div class="time-box">
          <span>Off at</span>
          <div class="time-val">
            <select aria-label="Off at">
              <option>04:00 AM</option><option>05:00 AM</option><option selected>06:00 AM</option><option>07:00 AM</option><option>08:00 AM</option>
            </select>
            <svg viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="pagination"><span class="dot"></span><span class="bar"></span></div>
</div>

<script>
  /* ---- room tabs ---- */
  const roomTabList = document.querySelectorAll('#roomTabs .tab');
  roomTabList.forEach(tabBtn => {
    tabBtn.addEventListener('click', () => {
      roomTabList.forEach(t => t.classList.remove('active'));
      tabBtn.classList.add('active');
      document.querySelector('.panel-head h1').textContent = tabBtn.textContent;
    });
  });

  /* ---- sidebar icons ---- */
  const sideIcons = document.querySelectorAll('#sideBar .side-icon:not(.blue)');
  sideIcons.forEach(ic => {
    ic.addEventListener('click', () => {
      sideIcons.forEach(o => o.classList.remove('lit'));
      ic.classList.add('lit');
    });
  });

  /* ---- segmented control ---- */
  const segButtons = document.querySelectorAll('#segCtl .seg');
  segButtons.forEach(sb => {
    sb.addEventListener('click', () => {
      segButtons.forEach(o => o.classList.remove('active'));
      sb.classList.add('active');
    });
  });

  /* ---- brightness slider ---- */
  const brightRangeEl = document.getElementById('brightRange');
  const brightValEl = document.getElementById('brightVal');
  function paintBrightness(){
    const v = brightRangeEl.value;
    brightRangeEl.style.background = 'linear-gradient(90deg, var(--blue) ' + v + '%, rgba(255,255,255,.35) ' + v + '%)';
    brightValEl.textContent = v + '%';
  }
  brightRangeEl.addEventListener('input', paintBrightness);
  paintBrightness();

  /* ---- color wheel handle ---- */
  const wheelEl = document.getElementById('colorWheel');
  const handleEl = document.getElementById('wheelHandle');
  wheelEl.addEventListener('pointerdown', moveHandle);
  wheelEl.addEventListener('pointermove', e => { if(e.buttons === 1) moveHandle(e); });
  function moveHandle(e){
    const rect = wheelEl.getBoundingClientRect();
    const r = rect.width / 2;
    let px = e.clientX - rect.left - r;
    let py = e.clientY - rect.top - r;
    const dist = Math.hypot(px, py);
    const maxD = r - 10;
    if(dist > maxD){ px = px / dist * maxD; py = py / dist * maxD; }
    handleEl.style.left = (r + px) + 'px';
    handleEl.style.top  = (r + py) + 'px';
    handleEl.style.transform = 'translate(-50%,-50%)';
  }

  /* ---- open / close LED panel ---- */
  const ledPanelEl = document.getElementById('ledPanel');
  const ledCardEl = document.getElementById('ledCard');
  document.getElementById('closeLed').addEventListener('click', () => ledPanelEl.classList.add('hidden'));
  ledCardEl.addEventListener('click', e => {
    if(e.target.closest('.switch')) return;
    ledPanelEl.classList.remove('hidden');
  });
</script>
</body>
</html>
