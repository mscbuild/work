<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims Luxury Builders</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-font: 'Cinzel', serif;
            --secondary-font: 'Lato', sans-serif;
            --text-light: #ffffff;
            --overlay-dark: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            font-family: var(--secondary-font);
        }

        /* Hero Section & Zoom Effect */
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowZoom 30s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.4) 100%);
            z-index: 0;
        }

        /* Header / Navigation */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            color: var(--text-light);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-main {
            font-family: var(--primary-font);
            font-size: 2rem;
            letter-spacing: 2px;
            line-height: 1;
        }

        .logo-sub {
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: opacity 0.3s;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .phone-number {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 0.6rem 1.5rem;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-outline:hover {
            background: white;
            color: black;
        }

        .login-btn {
            background: none;
            border: none;
            color: white;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        /* Mobile Menu Toggle */
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        /* Main Content */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
            padding: 0 2rem;
            margin-top: -5vh; /* Slight offset to match visual balance */
        }

        h1 {
            font-family: var(--primary-font);
            color: var(--text-light);
            font-size: 3.5rem;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.3rem;
            font-weight: 300;
            margin-bottom: 3rem;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }

        .cta-button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.6);
            color: white;
            padding: 1rem 2.5rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(2px);
        }

        .cta-button:hover {
            background: white;
            color: black;
            border-color: white;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            opacity: 0.8;
            animation: bounce 2s infinite;
        }

        .mouse {
            width: 24px;
            height: 36px;
            border: 2px solid white;
            border-radius: 12px;
            position: relative;
            margin-bottom: 8px;
        }

        .wheel {
            width: 4px;
            height: 6px;
            background: white;
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            h1 { font-size: 2.8rem; }
            .nav-menu { display: none; }
            .phone-number { display: none; }
            .mobile-toggle { display: block; }
            header { padding: 1.5rem 2rem; }
            
            /* Mobile Menu Overlay */
            .mobile-nav-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.95);
                z-index: 100;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2rem;
                transform: translateY(-100%);
                transition: transform 0.4s ease-in-out;
            }

            .mobile-nav-overlay.active {
                transform: translateY(0);
            }

            .mobile-nav-overlay a {
                color: white;
                font-size: 1.5rem;
                text-decoration: none;
                font-family: var(--primary-font);
                letter-spacing: 2px;
            }

            .close-mobile-menu {
                position: absolute;
                top: 2rem;
                right: 2rem;
                background: none;
                border: none;
                color: white;
                font-size: 2rem;
                cursor: pointer;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            .logo-main { font-size: 1.5rem; }
            .logo-sub { font-size: 0.5rem; }
            .btn-outline { padding: 0.5rem 1rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Background Image with Zoom -->
        <div class="bg-image-wrapper">
            <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=2075&auto=format&fit=crop" alt="Luxury Modern Home" class="bg-image">
        </div>
        
        <!-- Dark Overlay for readability -->
        <div class="overlay"></div>

        <!-- Header -->
        <header>
            <a href="#" class="logo">
                 <div class="logo-text">
                    <span class="logo-main">BOHEMA</span>
                    <span class="logo-sub">Luxury Builders</span>
                </div>
            </a>

            <ul class="nav-menu">
                <li><a href="#" class="nav-link">Services</a></li>
                <li><a href="#" class="nav-link">Portfolio</a></li>
                <li><a href="#" class="nav-link">Resources</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link">Contact Us</a></li>
            </ul>

            <div class="header-actions">
                <span class="phone-number">291-326-9487</span>
                <a href="#" class="btn-outline">Contact Us</a>
                <button class="login-btn">Login <i class="bi bi-person-fill"></i></button>
                <button class="mobile-toggle" onclick="toggleMenu()"><i class="bi bi-list"></i></button>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <h1>Luxury Homebuilding.<br>Down-to-Earth Advice.</h1>
            <p class="subtitle">We bring your wildest visions of the ideal home to life.</p>
            <button class="cta-button">Let Us Help</button>
        </main>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator">
            <div class="mouse">
                <div class="wheel"></div>
            </div>
        </div>
    </div>

     

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobileNav');
            menu.classList.toggle('active');
            
            // Prevent scrolling when menu is open
            if(menu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }
    </script>
</body>
</html>
